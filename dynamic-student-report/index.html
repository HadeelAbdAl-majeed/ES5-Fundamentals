<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Reports</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    padding: 40px;
}

h1 {
    text-align: center;
    margin-bottom: 30px;
    color: #222;
}

.students-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    max-width: 1100px;
    margin: auto;
}

.student-card {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
}

.student-card h2 {
    margin-bottom: 15px;
}

.student-card p {
    margin: 10px 0;
    color: #555;
}

.status {
    font-weight: bold;
}

.passed {
    color: green;
}

.failed {
    color: red;
}
    </style>
</head>

<body>

    <h1>Student Reports</h1>

    <div id="studentReports" class="students-container"></div>

    <script src="app.js"></script>
</body>
</html>
